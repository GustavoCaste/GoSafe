spring.application.name=gosafe-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# db/seed traz a carga inicial de Salvador; os testes usam só db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Autenticação: GOSAFE_JWT_SECRET é obrigatório (mínimo 32 bytes); sem ele a API não inicia
gosafe.jwt.secret=${GOSAFE_JWT_SECRET}
gosafe.jwt.expiration-hours=24
# E-mails que recebem papel ADMIN ao se cadastrar (separados por vírgula)
gosafe.admin-emails=${GOSAFE_ADMIN_EMAILS:}

# Verificação facial simulada: desligada fora do perfil dev e dos testes (RF06 é trabalho futuro)
gosafe.verification.simulated-enabled=false

# Geocodificação (ViaCEP + Nominatim/OpenStreetMap)
gosafe.geo.user-agent=GoSafe-TCC/0.1 (+https://github.com/GustavoCaste/GoSafe)

# RN18: local "não aconselhado" — mínimo de usuárias avaliando e nota-limite (escala 1–5)
gosafe.alert.min-reviews=100
gosafe.alert.max-rating=1.5

# Check-in
gosafe.checkin.radius-meters=100
gosafe.checkin.max-accuracy-meters=100
gosafe.checkin.window-hours=4
