spring.datasource.url=jdbc:h2:mem:gosafe;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

gosafe.jwt.secret=test-secret-for-automated-tests-only-32b
gosafe.admin-emails=admin@gosafe.test
gosafe.alert.min-reviews=5
gosafe.alert.max-rating=1.5
